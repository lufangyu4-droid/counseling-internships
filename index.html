<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心實境 MindIntern | 北北桃諮商實習與心理機構招募地圖</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sage: {
              50: '#f4f7f5',
              100: '#e5ece7',
              200: '#cedcd1',
              500: '#52796f',
              600: '#354f52',
              700: '#2f3e46',
            },
            warm: {
              50: '#faf8f5',
              100: '#f5f0ea',
              200: '#ebe1d5',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .kanban-col { min-height: 480px; }
  </style>
</head>
<body class="bg-warm-50 text-slate-800 min-h-screen flex flex-col">

  <!-- 頂部導覽列 -->
  <header class="bg-white border-b border-warm-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-sage-500 text-white flex items-center justify-center shadow-md">
          <i data-lucide="compass" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold text-sage-700 tracking-tight flex items-center gap-2">
            心實境 <span class="text-xs bg-sage-100 text-sage-600 px-2 py-0.5 rounded-full font-medium">北北桃版</span>
          </h1>
          <p class="text-xs text-slate-600">臺灣諮商心理研究所實習與徵才媒合系統</p>
        </div>
      </div>

      <!-- 切換頁籤與操作 -->
      <div class="flex items-center space-x-2 sm:space-x-4">
        <nav class="flex bg-warm-100 p-1 rounded-xl text-sm font-medium text-slate-600">
          <button id="navExplore" onclick="switchTab('explore')" class="px-3.5 py-1.5 rounded-lg bg-white text-sage-700 shadow-sm transition flex items-center gap-1.5">
            <i data-lucide="search" class="w-4 h-4"></i>
            <span>機構檢索</span>
          </button>
          <button id="navKanban" onclick="switchTab('kanban')" class="px-3.5 py-1.5 rounded-lg hover:text-sage-700 transition flex items-center gap-1.5">
            <i data-lucide="trello" class="w-4 h-4"></i>
            <span>申請看板</span>
            <span id="kanbanCountBadge" class="ml-1 text-xs px-1.5 py-0.2 bg-sage-500 text-white rounded-full">0</span>
          </button>
        </nav>
        <button onclick="openModal('addModal')" class="bg-sage-600 hover:bg-sage-700 text-white text-sm px-3.5 py-2 rounded-xl flex items-center gap-1.5 shadow transition">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span class="hidden sm:inline">新增機構</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 主內容容器 -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full">

    <!-- 檢索與探索視圖 (Explore Tab) -->
    <section id="viewExplore" class="space-y-6">
      
      <!-- 搜尋與多重篩選面板 -->
      <div class="bg-white rounded-2xl p-5 border border-warm-200 shadow-sm space-y-4">
        
        <!-- 城市與關鍵字欄位 -->
        <div class="flex flex-col md:flex-row gap-3">
          <!-- 城市快捷選擇 -->
          <div class="flex bg-warm-100 p-1 rounded-xl text-sm font-medium w-full md:w-auto">
            <button onclick="setCityFilter('all')" class="city-btn flex-1 md:flex-initial px-4 py-2 rounded-lg bg-white text-sage-700 shadow-sm transition" data-city="all">全生活圈</button>
            <button onclick="setCityFilter('台北市')" class="city-btn flex-1 md:flex-initial px-4 py-2 rounded-lg text-slate-600 hover:text-sage-700 transition" data-city="台北市">台北市</button>
            <button onclick="setCityFilter('新北市')" class="city-btn flex-1 md:flex-initial px-4 py-2 rounded-lg text-slate-600 hover:text-sage-700 transition" data-city="新北市">新北市</button>
            <button onclick="setCityFilter('桃園市')" class="city-btn flex-1 md:flex-initial px-4 py-2 rounded-lg text-slate-600 hover:text-sage-700 transition" data-city="桃園市">桃園市</button>
          </div>

          <!-- 關鍵字搜尋框 -->
          <div class="relative flex-1">
            <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-3.5 text-slate-400"></i>
            <input type="text" id="searchInput" oninput="applyFilters()" placeholder="搜尋機構名稱、捷運站點、督導專長或關鍵字..." class="w-full pl-10 pr-4 py-2 bg-warm-50 rounded-xl border border-warm-200 text-sm focus:outline-none focus:ring-2 focus:ring-sage-500">
          </div>
        </div>

        <!-- 細部過濾器（行政區、實習類別、場域、督導福利） -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs sm:text-sm">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">行政區</label>
            <select id="districtSelect" onchange="applyFilters()" class="w-full bg-warm-50 border border-warm-200 rounded-lg p-2 text-slate-700 focus:ring-1 focus:ring-sage-500">
              <option value="all">全部行政區</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">招募身分</label>
            <select id="roleSelect" onchange="applyFilters()" class="w-full bg-warm-50 border border-warm-200 rounded-lg p-2 text-slate-700 focus:ring-1 focus:ring-sage-500">
              <option value="all">所有類別</option>
              <option value="全職實習">碩三全職駐地實習</option>
              <option value="兼職實習">碩二兼職實習</option>
              <option value="諮商心理師">執照諮商心理師</option>
              <option value="實習行政">行政兼任/助教</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">機構場域屬性</label>
            <select id="settingSelect" onchange="applyFilters()" class="w-full bg-warm-50 border border-warm-200 rounded-lg p-2 text-slate-700 focus:ring-1 focus:ring-sage-500">
              <option value="all">全部場域</option>
              <option value="大專校院">大專校院心輔中心</option>
              <option value="社區諮商所">社區心理諮商所</option>
              <option value="醫療院所">醫療院所精神科</option>
              <option value="國高中輔導">高中職/國中輔導室</option>
              <option value="社福基金會">社福/基金會機構</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">福利與保障</label>
            <select id="perkSelect" onchange="applyFilters()" class="w-full bg-warm-50 border border-warm-200 rounded-lg p-2 text-slate-700 focus:ring-1 focus:ring-sage-500">
              <option value="all">不限福利</option>
              <option value="has_allowance">有提供實習津貼/車馬費</option>
              <option value="high_supervision">個督每週 $\ge$ 1.5小時</option>
            </select>
          </div>
        </div>
      </div>

      <!-- 機構總覽與列表 -->
      <div>
        <div class="flex items-center justify-between mb-4">
          <div class="text-sm text-slate-500">
            符合條件機構：<span id="resultCount" class="font-bold text-sage-600">0</span> 家
          </div>
          <div class="text-xs text-slate-600 flex items-center gap-1">
            <i data-lucide="info" class="w-3.5 h-3.5 text-sage-500"></i>
            督導規範符合臺灣諮商心理師實習法規門檻
          </div>
        </div>

        <!-- 卡片網格 -->
        <div id="cardsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
          <!-- 卡片由 JavaScript 動態生成 -->
        </div>
      </div>
    </section>

    <!-- 申請進度看板視圖 (Kanban Tab) -->
    <section id="viewKanban" class="hidden space-y-4">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-white p-4 rounded-xl border border-warm-200 shadow-sm">
        <div>
          <h2 class="text-lg font-bold text-sage-700 flex items-center gap-2">
            <i data-lucide="layout-dashboard" class="w-5 h-5 text-sage-500"></i>
            個人實習申請進度追蹤
          </h2>
          <p class="text-xs text-slate-600">可自由將機構在不同階段移動，紀錄申請進度、備審清單與筆面試筆記</p>
        </div>
        <button onclick="exportKanbanData()" class="text-xs bg-warm-100 hover:bg-warm-200 text-slate-700 px-3 py-1.5 rounded-lg border border-warm-200 flex items-center gap-1.5 transition">
          <i data-lucide="download" class="w-3.5 h-3.5"></i>
          匯出備份 JSON
        </button>
      </div>

      <!-- 5 個階段看板 -->
      <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
        <!-- 考慮中 -->
        <div class="bg-warm-100/70 rounded-xl p-3 border border-warm-200 flex flex-col">
          <div class="flex items-center justify-between pb-2 mb-2 border-b border-warm-200">
            <span class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-slate-400"></span> 考慮關注中
            </span>
            <span id="count_considering" class="text-xs px-1.5 py-0.5 rounded-full bg-white text-slate-600 font-medium">0</span>
          </div>
          <div id="col_considering" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'considering')" class="kanban-col space-y-3 flex-1"></div>
        </div>

        <!-- 備審撰寫中 -->
        <div class="bg-warm-100/70 rounded-xl p-3 border border-warm-200 flex flex-col">
          <div class="flex items-center justify-between pb-2 mb-2 border-b border-warm-200">
            <span class="text-xs font-bold text-amber-700 flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-amber-400"></span> 備審撰寫中
            </span>
            <span id="count_preparing" class="text-xs px-1.5 py-0.5 rounded-full bg-white text-amber-700 font-medium">0</span>
          </div>
          <div id="col_preparing" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'preparing')" class="kanban-col space-y-3 flex-1"></div>
        </div>

        <!-- 已寄出投遞 -->
        <div class="bg-warm-100/70 rounded-xl p-3 border border-warm-200 flex flex-col">
          <div class="flex items-center justify-between pb-2 mb-2 border-b border-warm-200">
            <span class="text-xs font-bold text-blue-700 flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-blue-400"></span> 已送件完成
            </span>
            <span id="count_submitted" class="text-xs px-1.5 py-0.5 rounded-full bg-white text-blue-700 font-medium">0</span>
          </div>
          <div id="col_submitted" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'submitted')" class="kanban-col space-y-3 flex-1"></div>
        </div>

        <!-- 筆面試通知 -->
        <div class="bg-warm-100/70 rounded-xl p-3 border border-warm-200 flex flex-col">
          <div class="flex items-center justify-between pb-2 mb-2 border-b border-warm-200">
            <span class="text-xs font-bold text-purple-700 flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-purple-400"></span> 筆面試通知
            </span>
            <span id="count_interview" class="text-xs px-1.5 py-0.5 rounded-full bg-white text-purple-700 font-medium">0</span>
          </div>
          <div id="col_interview" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'interview')" class="kanban-col space-y-3 flex-1"></div>
        </div>

        <!-- 放榜與錄取 -->
        <div class="bg-warm-100/70 rounded-xl p-3 border border-warm-200 flex flex-col">
          <div class="flex items-center justify-between pb-2 mb-2 border-b border-warm-200">
            <span class="text-xs font-bold text-emerald-700 flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-emerald-500"></span> 放榜與錄取
            </span>
            <span id="count_offered" class="text-xs px-1.5 py-0.5 rounded-full bg-white text-emerald-700 font-medium">0</span>
          </div>
          <div id="col_offered" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'offered')" class="kanban-col space-y-3 flex-1"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- 彈窗：新增/回報機構資訊 -->
  <div id="addModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-warm-200 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <h3 class="font-bold text-sage-700 text-base flex items-center gap-2">
          <i data-lucide="plus-circle" class="w-5 h-5 text-sage-500"></i>
          新增 / 回報實習招募資訊
        </h3>
        <button onclick="closeModal('addModal')" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>

      <form id="addForm" onsubmit="handleAddInstitution(event)" class="space-y-3 text-xs sm:text-sm">
        <div>
          <label class="block font-medium text-slate-700 mb-1">機構全銜 *</label>
          <input type="text" id="formName" required placeholder="例如：國立臺灣師範大學心理輔導中心" class="w-full bg-warm-50 border border-warm-200 rounded-lg p-2.5 focus:ring-1 focus:ring-sage-500">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-medium text-slate-700 mb-1">縣市 *</label>
            <select id="formCity" onchange="updateFormDistricts()" required class="w-full bg-warm-50 border border-warm-200 rounded-lg p-2.5">
              <option value="台北市">台北市</option>
              <option value="新北市">新北市</option>
              <option value="桃園市">桃園市</option>
            </select>
          </div>
          <div>
            <label class="block font-medium text-slate-700 mb-1">行政區 *</label>
            <select id="formDistrict" required class="w-full bg-warm-50 border border-warm-200 rounded-lg p-2.5"></select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-medium text-slate-700 mb-1">招募身分 *</label>
            <select id="formRole" required class="w-full bg-warm-50 border border-warm-200 rounded-lg p-2.5">
              <option value="全職實習">全職實習</option>
              <option value="兼職實習">兼職實習</option>
              <option value="諮商心理師">諮商心理師</option>
              <option value="實習行政">實習行政</option>
            </select>
          </div>
          <div>
            <label class="block font-medium text-slate-700 mb-1">場域屬性 *</label>
            <select id="formSetting" required class="w-full bg-warm-50 border border-warm-200 rounded-lg p-2.5">
              <option value="大專校院">大專校院</option>
              <option value="社區諮商所">社區諮商所</option>
              <option value="醫療院所">醫療院所</option>
              <option value="國高中輔導">國高中輔導</option>
              <option value="社福基金會">社福基金會</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-medium text-slate-700 mb-1">截止日期</label>
            <input type="date" id="formDeadline" class="w-full bg-warm-50 border border-warm-200 rounded-lg p-2.5">
          </div>
          <div>
            <label class="block font-medium text-slate-700 mb-1">實習津貼</label>
            <input type="text" id="formAllowance" placeholder="例如：月津貼 5,000 元 或 無津貼" class="w-full bg-warm-50 border border-warm-200 rounded-lg p-2.5">
          </div>
        </div>

        <div>
          <label class="block font-medium text-slate-700 mb-1">個別督導安排說明</label>
          <input type="text" id="formSupervision" placeholder="例如：每週 1.5 小時（資深心理師外聘督導）" class="w-full bg-warm-50 border border-warm-200 rounded-lg p-2.5">
        </div>

        <div>
          <label class="block font-medium text-slate-700 mb-1">招募簡章或官網連結</label>
          <input type="url" id="formUrl" placeholder="https://..." class="w-full bg-warm-50 border border-warm-200 rounded-lg p-2.5">
        </div>

        <div class="pt-2 flex justify-end gap-2">
          <button type="button" onclick="closeModal('addModal')" class="px-4 py-2 rounded-xl text-slate-600 bg-warm-100 hover:bg-warm-200">取消</button>
          <button type="submit" class="px-5 py-2 rounded-xl text-white bg-sage-600 hover:bg-sage-700 shadow font-medium">儲存新增</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 彈窗：個人備忘與應備文件檢核 -->
  <div id="detailModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-warm-200 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <div>
          <h3 id="modalInstName" class="font-bold text-sage-700 text-base">機構詳情與備忘</h3>
          <p id="modalInstSub" class="text-xs text-slate-500">台北市大安區 · 大專校院</p>
        </div>
        <button onclick="closeModal('detailModal')" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>

      <!-- 應備文件檢核 -->
      <div class="space-y-2">
        <label class="block text-xs font-bold text-slate-700">📋 備審文件備妥檢查清單</label>
        <div class="grid grid-cols-2 gap-2 text-xs bg-warm-50 p-3 rounded-xl border border-warm-200">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" id="chk_cv" onchange="saveChecklist()" class="rounded text-sage-600 focus:ring-sage-500">
            <span>個人履歷與自傳</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" id="chk_plan" onchange="saveChecklist()" class="rounded text-sage-600 focus:ring-sage-500">
            <span>實習計畫書 (含理念)</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" id="chk_grade" onchange="saveChecklist()" class="rounded text-sage-600 focus:ring-sage-500">
            <span>碩士在學成績單</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" id="chk_rec" onchange="saveChecklist()" class="rounded text-sage-600 focus:ring-sage-500">
            <span>指導教授推薦函</span>
          </label>
        </div>
      </div>

      <!-- 個人備忘筆記 -->
      <div class="space-y-1">
        <label class="block text-xs font-bold text-slate-700">✍️ 面試重點與考古題個人備忘</label>
        <textarea id="modalNote" rows="4" placeholder="在此記錄機構偏好諮商學派、歷年面試問題（如危機處理演練、團體歷程）、面試交通指南等..." class="w-full bg-warm-50 border border-warm-200 rounded-xl p-3 text-xs text-slate-700 focus:ring-1 focus:ring-sage-500"></textarea>
      </div>

      <div class="pt-2 flex justify-between items-center">
        <button id="modalGoogleMapBtn" target="_blank" class="text-xs text-sage-600 hover:underline flex items-center gap-1">
          <i data-lucide="map-pin" class="w-3.5 h-3.5"></i> 在 Google 地圖查看位置
        </button>
        <button onclick="saveModalDetails()" class="px-4 py-2 rounded-xl text-white bg-sage-600 hover:bg-sage-700 text-xs font-medium">儲存筆記</button>
      </div>
    </div>
  </div>

  <footer class="bg-white border-t border-warm-200 py-6 mt-12 text-center text-xs text-slate-600">
    <p>心實境 MindIntern © 專為臺灣諮商心理所研究生研發設計 · 遵循臺灣諮商心理師實習法規門檻標準</p>
  </footer>

  <script>
    // 預設北北桃機構範例資料庫
    const INITIAL_INSTITUTIONS = [
      {
        id: "ntu_counseling",
        name: "國立臺灣大學心理輔導中心",
        city: "台北市",
        district: "大安區",
        type: "全職實習",
        setting: "大專校院",
        deadline: "2026-11-20",
        supervision: "每週個別督導 1.5 小時（資深專任心理師）",

    // 行政區對應資料表

      "桃園市": ["中壢區", "桃園區", "龜山區", "八德區", "平鎮區", "蘆竹區", "大園區", "楊梅區", "大溪區"]

    // 狀態變數
    let currentCity = 'all';
    let institutions = [];
    let kanbanState = {}; // { [id]: 'considering' | 'preparing' | 'submitted' | 'interview' | 'offered' }

    // 初始化載入
    window.addEventListener('DOMContentLoaded', () => {
      loadStoredData();
      populateDistrictDropdown();
      applyFilters();
      renderKanban();
      lucide.createIcons();
    });

    // 讀取 LocalStorage
    function loadStoredData() {
      const storedInsts = localStorage.getItem('mindintern_institutions');
      institutions = storedInsts ? JSON.parse(storedInsts) : INITIAL_INSTITUTIONS;
      
      const storedKanban = localStorage.getItem('mindintern_kanban');
      kanbanState = storedKanban ? JSON.parse(storedKanban) : {
        "ntu_counseling": "preparing",
        "see_mind_clinic": "considering",
        "femh_psych": "submitted"
      };

      const storedNotes = localStorage.getItem('mindintern_notes');
      notesState = storedNotes ? JSON.parse(storedNotes) : {};
    }

    // 儲存資料回 LocalStorage
    function saveAllData() {
      localStorage.setItem('mindintern_institutions', JSON.stringify(institutions));
      localStorage.setItem('mindintern_kanban', JSON.stringify(kanbanState));
      localStorage.setItem('mindintern_notes', JSON.stringify(notesState));
    }

    // 頁籤切換
    function switchTab(tab) {
      const exploreView = document.getElementById('viewExplore');
      const kanbanView = document.getElementById('viewKanban');
      const navExp = document.getElementById('navExplore');
      const navKan = document.getElementById('navKanban');

      if (tab === 'explore') {
        exploreView.classList.remove('hidden');
        kanbanView.classList.add('hidden');
        navExp.className = "px-3.5 py-1.5 rounded-lg bg-white text-sage-700 shadow-sm transition flex items-center gap-1.5";
        navKan.className = "px-3.5 py-1.5 rounded-lg text-slate-600 hover:text-sage-700 transition flex items-center gap-1.5";
      } else {
        exploreView.classList.add('hidden');
        kanbanView.classList.remove('hidden');
        navKan.className = "px-3.5 py-1.5 rounded-lg bg-white text-sage-700 shadow-sm transition flex items-center gap-1.5";
        navExp.className = "px-3.5 py-1.5 rounded-lg text-slate-600 hover:text-sage-700 transition flex items-center gap-1.5";
        renderKanban();
      }
      lucide.createIcons();
    }

    // 切換城市篩選
    function setCityFilter(city) {
      currentCity = city;
      document.querySelectorAll('.city-btn').forEach(btn => {
        if (btn.getAttribute('data-city') === city) {
          btn.className = "city-btn flex-1 md:flex-initial px-4 py-2 rounded-lg bg-white text-sage-700 shadow-sm transition";
        } else {
          btn.className = "city-btn flex-1 md:flex-initial px-4 py-2 rounded-lg text-slate-600 hover:text-sage-700 transition";
        }
      });
      populateDistrictDropdown();
      applyFilters();
    }

    // 填充行政區下拉選單
    function populateDistrictDropdown() {
      const select = document.getElementById('districtSelect');
      select.innerHTML = '<option value="all">全部行政區</option>';
      
      let list = [];
      if (currentCity === 'all') {
        list = [...DISTRICT_MAP["台北市"], ...DISTRICT_MAP["新北市"], ...DISTRICT_MAP["桃園市"]];
      } else if (DISTRICT_MAP[currentCity]) {
        list = DISTRICT_MAP[currentCity];
      }

      list.forEach(dist => {
        const opt = document.createElement('option');
        opt.value = dist;
        opt.textContent = dist;
        select.appendChild(opt);
      });
    }

    // 執行卡片篩選
    function applyFilters() {
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
      const district = document.getElementById('districtSelect').value;
      const role = document.getElementById('roleSelect').value;
      const setting = document.getElementById('settingSelect').value;
      const perk = document.getElementById('perkSelect').value;

      const filtered = institutions.filter(item => {
        // 城市
        if (currentCity !== 'all' && item.city !== currentCity) return false;
        // 行政區
        if (district !== 'all' && item.district !== district) return false;
        // 身分
        if (role !== 'all' && item.type !== role) return false;
        // 場域
        if (setting !== 'all' && item.setting !== setting) return false;
        // 福利
        if (perk === 'has_allowance' && (item.allowance.includes('無') || item.allowance.includes('未提及'))) return false;
        if (perk === 'high_supervision' && !item.supervision.includes('1.5') && !item.supervision.includes('2')) return false;
        // 關鍵字搜尋
        if (keyword) {
          const matchTarget = (item.name + item.city + item.district + item.supervision + item.allowance + (item.tags ? item.tags.join(' ') : '')).toLowerCase();
          if (!matchTarget.includes(keyword)) return false;
        }
        return true;
      });

      renderCards(filtered);
    }

    // 渲染卡片
    function renderCards(list) {
      const grid = document.getElementById('cardsGrid');
      document.getElementById('resultCount').textContent = list.length;
      grid.innerHTML = '';

      if (list.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full py-16 text-center text-slate-600 space-y-2">
            <i data-lucide="inbox" class="w-12 h-12 mx-auto text-slate-300"></i>
            <p class="text-sm">查無符合條件之機構，請放寬搜尋或篩選條件。</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      list.forEach(inst => {
        const inKanban = kanbanState[inst.id];
        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl p-5 border border-warm-200 shadow-sm hover:shadow-md transition flex flex-col justify-between space-y-4";
        card.innerHTML = `
          <div>
            <div class="flex items-start justify-between gap-2">
              <span class="text-xs px-2.5 py-0.5 rounded-full font-medium ${
                inst.type === '全職實習' ? 'bg-sage-100 text-sage-700' : 'bg-warm-200 text-slate-700'
              }">${inst.type}</span>
              <span class="text-xs text-slate-600 flex items-center gap-1">
                <i data-lucide="map-pin" class="w-3.5 h-3.5 text-sage-500"></i> ${inst.city} ${inst.district}
              </span>
            </div>

            <h3 class="text-base font-bold text-slate-800 mt-2 hover:text-sage-600 transition">
              <a href="${inst.url}" target="_blank" class="flex items-center gap-1">
                ${inst.name} <i data-lucide="external-link" class="w-3.5 h-3.5 text-slate-400"></i>
              </a>
            </h3>
            <p class="text-xs text-slate-600 mt-0.5">${inst.setting}</p>

            <div class="mt-4 space-y-1.5 text-xs text-slate-600 bg-warm-50 p-3 rounded-xl border border-warm-100">
              <div class="flex items-center gap-1.5">
                <i data-lucide="calendar" class="w-3.5 h-3.5 text-amber-600"></i>
                <span>申請截止：<strong class="text-slate-700">${inst.deadline || '簡章公告'}</strong></span>
              </div>
              <div class="flex items-center gap-1.5">
                <i data-lucide="user-check" class="w-3.5 h-3.5 text-sage-600"></i>
                <span>個別督導：${inst.supervision}</span>
              </div>
              <div class="flex items-center gap-1.5">
                <i data-lucide="coins" class="w-3.5 h-3.5 text-emerald-600"></i>
                <span>津貼福利：${inst.allowance}</span>
              </div>
            </div>

            ${inst.tags ? `
              <div class="mt-3 flex flex-wrap gap-1.5">
                ${inst.tags.map(t => `<span class="text-[11px] px-2 py-0.5 bg-slate-100 text-slate-600 rounded-md"># ${t}</span>`).join('')}
              </div>
            ` : ''}
          </div>

          <div class="pt-3 border-t border-slate-100 flex items-center justify-between text-xs">
            <button onclick="openDetailModal('${inst.id}')" class="text-sage-600 hover:text-sage-700 flex items-center gap-1 font-medium">
              <i data-lucide="clipboard-list" class="w-3.5 h-3.5"></i> 備審清單與筆記
            </button>
            <button onclick="toggleKanban('${inst.id}')" class="px-3 py-1.5 rounded-lg border transition flex items-center gap-1.5 ${
              inKanban 
                ? 'bg-sage-50 border-sage-500 text-sage-700' 
                : 'bg-white border-warm-200 text-slate-600 hover:border-sage-500 hover:text-sage-600'
            }">
              <i data-lucide="${inKanban ? 'check' : 'bookmark'}" class="w-3.5 h-3.5"></i>
              ${inKanban ? '追蹤中' : '加入看板'}
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
      lucide.createIcons();
    }

    // 看板加入/取消切換
    function toggleKanban(id) {
      if (kanbanState[id]) {
        delete kanbanState[id];
      } else {
        kanbanState[id] = 'considering';
      }
      saveAllData();
      applyFilters();
      renderKanban();
    }

    // 渲染看板欄位
    function renderKanban() {
      const stages = ['considering', 'preparing', 'submitted', 'interview', 'offered'];
      const counts = { considering: 0, preparing: 0, submitted: 0, interview: 0, offered: 0 };
      
      stages.forEach(st => {
        document.getElementById(`col_${st}`).innerHTML = '';
      });

      const totalTracked = Object.keys(kanbanState).length;
      document.getElementById('kanbanCountBadge').textContent = totalTracked;

      Object.entries(kanbanState).forEach(([id, stage]) => {
        const inst = institutions.find(item => item.id === id);
        if (!inst) return;
        counts[stage]++;

        const card = document.createElement('div');
        card.className = "bg-white p-3 rounded-xl border border-warm-200 shadow-sm cursor-grab active:cursor-grabbing text-xs space-y-2 hover:border-sage-500 transition";
        card.draggable = true;
        card.ondragstart = (e) => handleDragStart(e, id);

        card.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="font-bold text-slate-800 truncate">${inst.name}</span>
            <button onclick="toggleKanban('${id}')" class="text-slate-400 hover:text-red-500"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
          </div>
          <div class="text-slate-500 flex items-center justify-between text-[11px]">
            <span>${inst.city} · ${inst.type}</span>
            <span class="text-amber-700 font-medium">${inst.deadline}</span>
          </div>
          <div class="pt-2 border-t border-slate-100 flex items-center justify-between">
            <button onclick="openDetailModal('${id}')" class="text-sage-600 hover:underline flex items-center gap-1 text-[11px]">
              <i data-lucide="edit-3" class="w-3 h-3"></i> 筆記/清單
            </button>
            <select onchange="changeCardStage('${id}', this.value)" class="text-[11px] bg-warm-50 border border-warm-200 rounded p-1 text-slate-700">
              <option value="considering" ${stage === 'considering' ? 'selected' : ''}>考慮中</option>
              <option value="preparing" ${stage === 'preparing' ? 'selected' : ''}>備審撰寫</option>
              <option value="submitted" ${stage === 'submitted' ? 'selected' : ''}>已送件</option>
              <option value="interview" ${stage === 'interview' ? 'selected' : ''}>面試通知</option>
              <option value="offered" ${stage === 'offered' ? 'selected' : ''}>放榜錄取</option>
            </select>
          </div>
        `;
        document.getElementById(`col_${stage}`).appendChild(card);
      });

      // 更新數字
      stages.forEach(st => {
        document.getElementById(`count_${st}`).textContent = counts[st];
      });
      lucide.createIcons();
    }

    // 拖曳處理
    function handleDragStart(e, id) {
      e.dataTransfer.setData('text/plain', id);
    }
    function allowDrop(e) {
      e.preventDefault();
    }
    function handleDrop(e, targetStage) {
      e.preventDefault();
      const id = e.dataTransfer.getData('text/plain');
      if (id && kanbanState[id]) {
        kanbanState[id] = targetStage;
        saveAllData();
        renderKanban();
      }
    }
    function changeCardStage(id, stage) {
      kanbanState[id] = stage;
      saveAllData();
      renderKanban();
    }

    // 表單互動：更新行政區
    function updateFormDistricts() {
      const city = document.getElementById('formCity').value;
      const distSelect = document.getElementById('formDistrict');
      distSelect.innerHTML = '';
      (DISTRICT_MAP[city] || []).forEach(d => {
        const opt = document.createElement('option');
        opt.value = d;
        opt.textContent = d;
        distSelect.appendChild(opt);
      });
    }

    // 新增機構回報
    function handleAddInstitution(e) {
      e.preventDefault();
      const newInst = {
        id: "custom_" + Date.now(),
        name: document.getElementById('formName').value.trim(),
        city: document.getElementById('formCity').value,
        district: document.getElementById('formDistrict').value,
        type: document.getElementById('formRole').value,
        setting: document.getElementById('formSetting').value,
        deadline: document.getElementById('formDeadline').value || "詳見簡章",
        allowance: document.getElementById('formAllowance').value || "未提及/依規定",
        supervision: document.getElementById('formSupervision').value || "依公會法規標準",
        url: document.getElementById('formUrl').value || "#",
        status: "使用者登記",
        tags: ["社群回報"]
      };

      institutions.unshift(newInst);
      kanbanState[newInst.id] = "considering";
      saveAllData();
      closeModal('addModal');
      applyFilters();
      renderKanban();
      alert("✅ 已成功新增機構並加入您的追蹤看板！");
    }

    // 詳細筆記與檢核清單彈窗
    function openDetailModal(id) {
      activeModalInstId = id;
      const inst = institutions.find(i => i.id === id);
      if (!inst) return;

      document.getElementById('modalInstName').textContent = inst.name;
      document.getElementById('modalInstSub').textContent = `${inst.city} ${inst.district} · ${inst.setting} · ${inst.type}`;

      const saved = notesState[id] || { note: '', cv: false, plan: false, grade: false, rec: false };
      document.getElementById('modalNote').value = saved.note || '';
      document.getElementById('chk_cv').checked = !!saved.cv;
      document.getElementById('chk_plan').checked = !!saved.plan;
      document.getElementById('chk_grade').checked = !!saved.grade;
      document.getElementById('chk_rec').checked = !!saved.rec;

      const mapQuery = encodeURIComponent(`${inst.city} ${inst.district} ${inst.name}`);
      document.getElementById('modalGoogleMapBtn').onclick = () => {
        window.open(`https://www.google.com/maps/search/?api=1&query=${mapQuery}`, '_blank');
      };

      openModal('detailModal');
    }

    function saveChecklist() {
      if (!activeModalInstId) return;
      if (!notesState[activeModalInstId]) notesState[activeModalInstId] = {};
      notesState[activeModalInstId].cv = document.getElementById('chk_cv').checked;
      notesState[activeModalInstId].plan = document.getElementById('chk_plan').checked;
      notesState[activeModalInstId].grade = document.getElementById('chk_grade').checked;
      notesState[activeModalInstId].rec = document.getElementById('chk_rec').checked;
      saveAllData();
    }

    function saveModalDetails() {
      if (!activeModalInstId) return;
      if (!notesState[activeModalInstId]) notesState[activeModalInstId] = {};
      notesState[activeModalInstId].note = document.getElementById('modalNote').value;
      saveChecklist();
      saveAllData();
      closeModal('detailModal');
      alert("💾 備審清單與個人筆記已妥善儲存！");
    }

    // 匯出 JSON 備份
    function exportKanbanData() {
      const backup = {
        institutions: institutions,
        kanban: kanbanState,
        notes: notesState,
        exportedAt: new Date().toISOString()
      };
      const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `mindintern_backup_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // 通用彈窗控制
    function openModal(id) {
      if (id === 'addModal') updateFormDistricts();
      document.getElementById(id).classList.remove('hidden');
    }
    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
    }
  </script>
</body>
</html>
